# Render Blueprint — static deploy of the browser-only InvoiceChaser dashboard.
# Static sites on Render are free (no credit card, no server to maintain).
# To use: render.com → New → Blueprint → connect this repo+branch → Apply.
services:
  - type: web
    name: invoicechaser-dashboard
    runtime: static
    buildCommand: sh invoicechaser/web/build-static.sh
    staticPublishPath: invoicechaser/web/public
    pullRequestPreviewsEnabled: false
