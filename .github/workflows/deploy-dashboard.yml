name: Deploy InvoiceChaser dashboard

# Publishes the static, browser-only InvoiceChaser dashboard to the `gh-pages`
# branch. We publish to a branch (instead of the github-pages *environment*)
# so the deploy works from this feature branch — the environment route is
# restricted to the default branch by environment protection rules.
#
# One-time setup after the first run:
#   Settings → Pages → Build and deployment → Source: "Deploy from a branch"
#   → Branch: gh-pages  /(root)  → Save.   URL: https://gilhzn.github.io/ID_AA/

on:
  push:
    branches: [claude/app-feature-spec-BUHh4]
    paths:
      - "invoicechaser/web/**"
      - "invoicechaser/core/src/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: write # needed to push the built site to the gh-pages branch

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          mkdir -p site/engine
          cp invoicechaser/web/index.html site/
          cp invoicechaser/web/app.js site/
          cp invoicechaser/core/src/*.mjs site/engine/
          touch site/.nojekyll

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy dashboard (${{ github.sha }})"
